<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183f43">
  <title>바디올 클리닉 — 이 환자, 나잖아? | 생활공감 픽셀게임</title>
  <meta name="description" content="오늘은 내가 원장님. 퇴근했는데 아직 일하는 최대리에게 어떤 말을 건넬까요? 세 번의 선택으로 즐기는 생활공감 픽셀게임.">
  <link rel="canonical" href="https://wiki.body-all.co.kr/contents/bodyall-clinic/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="이 환자, 나잖아? — 바디올 클리닉">
  <meta property="og:description" content="오늘은 내가 원장님. 퇴근하고도 일 생각뿐인 최대리에게 무슨 말을 건넬까요?">
  <meta property="og:url" content="https://wiki.body-all.co.kr/contents/bodyall-clinic/">
  <link rel="stylesheet" href="style.css?v=2">
  <script src="story.js?v=2" defer></script>
  <script src="engine.js?v=2" defer></script>
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <main class="game-shell" id="game">
    <header class="window-bar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>바디올 클리닉 <small>BODYALL CLINIC</small></span></div>
      <div class="top-controls"><button id="sound-button" type="button" aria-pressed="false" title="효과음 켜기">소리 꺼짐</button><button id="help-button" type="button" aria-label="게임 이용 안내">?</button></div>
    </header>
    <div class="chapter-bar"><div><span class="chapter-index">첫 번째 이야기</span><h1>퇴근했는데 아직도 일하는 최대리</h1></div><span class="visit-badge">EP.01</span></div>
    <div class="role-bar" aria-label="등장인물과 내 역할"><span class="my-role"><strong>나</strong> 이야기를 듣는 원장님</span><span class="their-role"><strong>상대</strong> 직장인 최대리</span></div>
    <div class="play-layout">
      <section class="play-area" aria-label="최대리와 대화하기">
        <div class="scene" id="scene">
          <div class="scene-caption"><span class="scene-light" aria-hidden="true"></span>바디올 진료실 <span class="scene-time">늦은 오후</span></div>
          <div class="portrait" id="portrait" role="img" aria-label="가상의 직장인 최대리"></div>
          <div id="scene-content" class="scene-content"></div>
          <span class="patient-name" id="patient-name">지금 내 앞에 앉은 사람 <strong>최대리</strong></span>
        </div>
        <div class="conversation-frame">
          <div class="conversation-heading"><span id="speaker">오늘은 내가 원장님</span><span id="scene-count">EP.01</span></div>
          <div id="my-line" class="my-line" hidden></div>
          <div id="dialogue" class="dialogue" aria-live="polite" aria-atomic="true"></div>
          <h2 id="choice-prompt" class="choice-prompt" hidden></h2>
          <div id="choices" class="choices"></div>
        </div>
      </section>
      <aside class="journal" aria-label="오늘의 기록">
        <div class="journal-title"><span>BODYALL CLINIC</span><h2>최대리는 이런 사람</h2><span class="file-number">01</span></div>
        <div class="patient-file"><span class="file-caption">오늘 만난 사람</span><strong>최대리</strong><p>퇴근하고도<br>일 생각이 떠나지 않아요.</p></div>
        <ol class="step-list" aria-label="게임 진행"><li data-step="1"><span>01</span>말 걸기</li><li data-step="2"><span>02</span>일상 묻기</li><li data-step="3"><span>03</span>한마디 더</li></ol>
        <section class="clue-section"><h3>지금까지 들은 얘기 <span id="clue-count">0 / 2</span></h3><div id="clue-list"></div></section>
      </aside>
    </div>
    <footer class="game-footer"><p>가상 인물과 나누는 대화 게임입니다. 실제 진료가 아닙니다.</p><span>바디올한의원 제작</span></footer>
  </main>
  <dialog id="modal" class="modal"><div class="modal-titlebar"><h2 id="modal-title"></h2><button type="button" id="close-modal" aria-label="창 닫기">×</button></div><div id="modal-body" class="modal-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><div class="noscript">게임을 플레이하려면 브라우저에서 JavaScript를 켜주세요.</div></noscript>
</body>
</html>
