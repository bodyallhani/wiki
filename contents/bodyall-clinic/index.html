<body>
  <main class="game" id="game" data-state="intro">
    <header class="titlebar">
      <span class="app-title"><span class="tiny-diamond" aria-hidden="true">◆</span> 화타의 전생 진찰소</span>
      <div class="tools"><button id="sound" aria-pressed="false" title="음악과 목소리 켜기">소리 꺼짐</button><button id="help" aria-label="이용 안내">?</button></div>
    </header>
    <section class="stage" id="stage" aria-label="내 손목을 짚으며 거울을 들고 있는 화타">
      <div class="world" id="world" aria-hidden="true">
        <img class="room" src="assets/huata-room.webp" alt="" fetchpriority="high">
        <img class="wall-logo" src="assets/huata-symbol.webp" alt="">
        <img class="doctor doctor-lower" src="assets/huata-doctor.webp" alt="" fetchpriority="high">
        <div class="doctor-performance" id="doctor-performance">
          <div class="doctor-gesture" id="doctor-gesture" data-motion="rest">
            <img class="doctor doctor-upper" src="assets/huata-doctor.webp" alt="">
            <div class="doctor-face" id="doctor-face"></div>
          </div>
        </div>
        <div class="mirror-window" id="mirror-window"><div class="reflection" id="reflection"></div><div class="mirror-veil"></div><div class="mirror-shine"></div></div>
        <div class="light-motes"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="scene-vignette" aria-hidden="true"></div>
      <div class="speaker-tag"><span>한의사로 돌아온</span><strong>화타</strong></div>
      <div class="mutter" id="mutter" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="reveal-caption" id="reveal-caption" role="status"></div>
      <span class="mirror-hint" id="mirror-hint">거울 속에, 아직 모르는 나</span>
    </section>
    <section class="console" id="console" aria-label="전생 진찰">
      <div class="intro" id="intro">
        <p class="eyebrow">화타가 봐주는 삼국지 전생</p>
        <h1>당신은 전생에<br><em>누구였을까요?</em></h1>
        <p class="intro-line">“난 전생에 화타였다네. 자네는 누구였을까?”</p>
        <p class="friend-note" id="friend-note" hidden></p>
        <button class="primary start" id="start" disabled><span id="start-label">거울을 닦는 중…</span><span aria-hidden="true">→</span></button>
        <p class="intro-meta" id="asset-status">질문 10개 · 약 1분 · 가입 없이</p>
      </div>
      <div class="question-view" id="question-view" hidden>
        <div class="question-meta"><span>화타의 물음</span><span id="question-count">01 <i>/ 10</i></span></div>
        <div class="progress" role="progressbar" aria-label="진찰 진행" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress"><span id="progress-fill"></span></div>
        <h2 id="question" tabindex="-1"></h2>
        <div class="answers" id="answers"></div>
        <button class="back" id="back">← 이전 질문</button>
      </div>
      <div class="result-view" id="result-view" hidden>
        <p class="eyebrow" id="result-eyebrow">거울에 비친 당신의 전생</p>
        <h2 id="result-name" tabindex="-1"></h2><p class="result-title" id="result-title"></p>
        <div class="analysis" id="analysis"></div>
        <p class="result-quote" id="result-quote"></p>
        <div class="result-actions"><button class="primary" id="share">친구에게 공유하기 <span aria-hidden="true">↗</span></button><button class="secondary" id="retry">다시 해보기</button></div>
        <details class="story" id="story"><summary>이 인물이 궁금하다면</summary><p id="story-copy"></p><a id="story-source" target="_blank" rel="noopener">삼국지연의 속 이야기 ↗</a></details>
      </div>
    </section>
    <footer class="footer"><a href="https://wiki.body-all.co.kr/SART.html" target="_blank" rel="noopener" class="clinic"><img src="assets/huata-symbol.webp" alt="" width="24" height="22"><span>바디올한의원</span><span class="clinic-more">알아보기 ↗</span></a><p>삼국지연의를 바탕으로 만든 재미용 테스트입니다.</p></footer>

  <dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="창 닫기">×</button></div><div id="dialog-body"></div></dialog>
