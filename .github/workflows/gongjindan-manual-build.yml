name: Prepare Gongjindan manual images
on:
  push:
    branches: [gongjindan-manual-build-20261001]
    paths: ['.github/workflows/gongjindan-manual-build.yml']
permissions:
  contents: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gongjindan-manual-build-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Create review thumbnails from existing original assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          dest=Path('Herbmed/gongjindan-assets')
          dest.mkdir(parents=True,exist_ok=True)
          report=[]
          for name in ['bro1','bro2','bro3','9_hgmp_cert','10_herb_contrast','11111','structure','3_seed_structure']:
              source=Path('gokkjd')/(name+'.png')
              im=Image.open(source).convert('RGB')
              original=im.size
              im.thumbnail((1500,2200))
              im.save(dest/(name+'-review.jpg'),quality=85,optimize=True)
              report.append({'name':name,'original':original,'review':im.size})
          (dest/'image-review.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Save images to this isolated build branch
        run: |
          git config user.name "Bodyall manual build"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Herbmed/gongjindan-assets
          git diff --cached --quiet && exit 0
          git commit -m "Prepare source image previews for purchaser manual"
          git push origin HEAD:gongjindan-manual-build-20261001
