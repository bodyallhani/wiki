name: Verify deer antler supporting card
on:
  push:
    branches: [gongjindan-manual-build-20261001]
    paths: ['.github/workflows/gongjindan-manual-build.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gongjindan-manual-build-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check supporting card and responsive layout
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          from functools import partial
          import threading,http.server,json
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8765),partial(http.server.SimpleHTTPRequestHandler,directory='.'))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          report=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for lang,suffix in [('ko',''),('en','_en'),('cn','_cn')]:
                  for width in [320,390,768,1280]:
                      page=browser.new_page(viewport={'width':width,'height':900})
                      errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      page.goto('http://127.0.0.1:8765/Herbmed/gongjindan-manual'+suffix+'.html',wait_until='networkidle')
                      page.add_style_tag(content='html{scroll-behavior:auto!important}')
                      card=page.locator('.antler-feature')
                      assert card.count()==1
                      assert card.locator('.antler-compare>div').count()==2
                      assert '1,500' in card.inner_text()
                      assert '400' in card.inner_text()
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth')
                      assert page.locator('#faq details').count()==30
                      assert page.locator('nav.contents a').count()==5
                      assert page.locator('#mental-stamina').count()==1
                      assert not errors,errors
                      assert page.evaluate("""() => {
                        const card=document.querySelector('.antler-feature');
                        const seed=document.querySelector('.seed-figure');
                        return !!(seed.compareDocumentPosition(card)&Node.DOCUMENT_POSITION_FOLLOWING);
                      }""")
                      if width in [390,1280]:
                          card.screenshot(path='Herbmed/gongjindan-assets/'+lang+'-antler-'+str(width)+'-review.jpg',type='jpeg',quality=85)
                      report.append({'language':lang,'width':width,'card_count':1,'after_musk_structure':True,'document_overflow':False,'page_errors':errors})
                      page.close()
              browser.close()
          Path('Herbmed/gongjindan-assets/antler-qa-report.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Save review evidence on build branch
        run: |
          git config user.name "Bodyall manual build"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Herbmed/gongjindan-assets
          git commit -m "Verify deer antler card in three languages"
          git push origin HEAD:gongjindan-manual-build-20261001
