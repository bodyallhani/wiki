name: Verify updated musk photo and favicons
on:
  push:
    branches: [gongjindan-manual-build-20261001]
    paths: ['.github/workflows/gongjindan-manual-build.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gongjindan-manual-build-20261001
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Inspect responsive photo cards
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          from functools import partial
          import threading,http.server,json
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8765),partial(http.server.SimpleHTTPRequestHandler,directory='.'))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          report=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for lang,suffix,removed in [('ko','','조제 과정'),('en','_en','preparation process'),('cn','_cn','调制过程')]:
                  for width in [320,390,1280]:
                      page=browser.new_page(viewport={'width':width,'height':900})
                      errors=[]
                      page.on('pageerror',lambda e:errors.append(str(e)))
                      page.goto('http://127.0.0.1:8765/Herbmed/gongjindan-manual'+suffix+'.html',wait_until='networkidle')
                      page.add_style_tag(content='html{scroll-behavior:auto!important}')
                      proof=page.locator('#musk-documents')
                      proof.scroll_into_view_if_needed()
                      page.wait_for_function("document.querySelector('.musk-example img').complete && document.querySelector('.musk-example img').naturalWidth===750")
                      dims=page.locator('.musk-example img').bounding_box()
                      assert abs(dims['width']-dims['height'])<1
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth')
                      assert removed not in proof.inner_text()
                      assert page.locator('link[rel="icon"]').get_attribute('href')=='https://wiki.body-all.co.kr/Bodyall%20Logo.png'
                      assert page.locator('details').count()==30
                      assert not errors,errors
                      if width in [390,1280]:
                          proof.screenshot(path='Herbmed/gongjindan-assets/'+lang+'-musk-'+str(width)+'-review.jpg',type='jpeg',quality=85)
                      report.append({'language':lang,'width':width,'square_photo':True,'document_overflow':False,'favicon_correct':True,'preparation_offer_removed':True,'page_errors':errors})
                      page.close()
              browser.close()
          Path('Herbmed/gongjindan-assets/photo-qa-report.json').write_text(json.dumps(report,indent=2))
          PY
      - name: Save review evidence on build branch
        run: |
          git config user.name "Bodyall manual build"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Herbmed/gongjindan-assets
          git commit -m "Verify authentication photo cards at mobile and desktop widths"
          git push origin HEAD:gongjindan-manual-build-20261001
