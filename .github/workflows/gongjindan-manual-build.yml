name: Check published Gongjindan guide URLs
on:
  push:
    branches: [gongjindan-manual-build-20261001]
    paths: ['.github/workflows/gongjindan-manual-build.yml']
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gongjindan-manual-build-20261001
      - name: Confirm live HTML and brochure images
        run: |
          python3 - <<'PY'
          import urllib.request,time,json,concurrent.futures
          from pathlib import Path
          root='https://wiki.body-all.co.kr/Herbmed/'
          files=['gongjindan-manual.html','gongjindan-manual_en.html','gongjindan-manual_cn.html','gongjindan-assets/brochure-graph.jpg','gongjindan-assets/seed-brochure.jpg']
          def check(path):
              request=urllib.request.Request(root+path,headers={'User-Agent':'Bodyall-Guide-Verification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=20) as r:
                  data=r.read()
                  assert r.status==200
                  if path.endswith('.html'):
                      text=data.decode('utf-8')
                      assert 'faq-search' in text and 'musk-documents' in text
                      assert 'https://wiki.body-all.co.kr/Herbmed/encyclopedia/index.html' in text
                      assert text.count('<details>')==30
                  else:
                      assert data[:2]==b'\xff\xd8'
                  return {'url':root+path,'status':r.status,'bytes':len(data),'content_type':r.headers.get('Content-Type')}
          for attempt in range(10):
              try:
                  with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                      report=list(pool.map(check,files))
                  break
              except Exception as error:
                  print('Waiting for deployment:',error)
                  if attempt==9:raise
                  time.sleep(10)
          Path('Herbmed/gongjindan-assets/live-report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Save live check on build branch
        run: |
          git config user.name "Bodyall manual build"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Herbmed/gongjindan-assets/live-report.json
          git commit -m "Confirm live multilingual purchaser guide URLs"
          git push origin HEAD:gongjindan-manual-build-20261001
