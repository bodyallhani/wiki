name: Bodyall new wiki WebP images
on:
  push:
    branches: [main]
    paths: ['.wiki-image-jobs/*.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: bodyall-wiki-new-image-conversion
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codec
        run: python -m pip install Pillow==11.3.0
      - name: Convert only explicitly requested new wiki images
        run: python scripts/bodyall_wiki_images_v55.py
      - name: Request existing GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import os,time,urllib.request,urllib.error
          url='https://api.github.com/repos/bodyallhani/wiki/pages/builds'
          for attempt in range(4):
              request=urllib.request.Request(url,data=b'{}',method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      if response.status!=201:raise RuntimeError('PAGES_BUILD_NOT_ACCEPTED')
                  print('Existing Pages rebuild requested. Public image checks remain in Make.');break
              except urllib.error.HTTPError as error:
                  if error.code not in (409,429,500,502,503) or attempt==3:raise RuntimeError('PAGES_BUILD_REQUEST_HTTP_'+str(error.code)) from None
                  time.sleep(10)
          PYCODE
