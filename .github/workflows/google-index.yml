name: Validate sitemap for published HTML

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - '.github/workflows/google-index.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sitemap-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the published source
        uses: actions/checkout@v4

      - name: Validate sitemap URLs and repository targets
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import urllib.parse
          import xml.etree.ElementTree as ET

          root = pathlib.Path.cwd().resolve()
          sitemap = root / 'sitemap.xml'
          data = sitemap.read_bytes()
          if len(data) > 50 * 1024 * 1024:
              raise SystemExit('Sitemap exceeds the 50 MB uncompressed limit')
          document = ET.fromstring(data.decode('utf-8'))
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          if document.tag != ns + 'urlset':
              raise SystemExit('Expected a sitemap urlset')
          entries = document.findall(ns + 'url')
          if not 1 <= len(entries) <= 50000:
              raise SystemExit('Invalid sitemap URL count')
          seen = set()
          for entry in entries:
              locations = entry.findall(ns + 'loc')
              if len(locations) != 1:
                  raise SystemExit('Each sitemap entry must contain one loc')
              loc = (locations[0].text or '').strip()
              url = urllib.parse.urlsplit(loc)
              if (url.scheme != 'https' or url.netloc != 'wiki.body-all.co.kr'
                      or url.query or url.fragment or loc in seen):
                  raise SystemExit('Invalid or duplicate sitemap URL: ' + loc)
              seen.add(loc)
              path = urllib.parse.unquote(url.path).lstrip('/')
              if not path or path.endswith('/'):
                  path += 'index.html'
              target = (root / path).resolve()
              if not target.is_relative_to(root) or not target.is_file():
                  raise SystemExit('Sitemap target missing from source: ' + loc)
          message = (
              f'Validated {len(seen)} sitemap URLs and repository targets.\n\n'
              'Discovery uses the published sitemap and Search Console. '
              'Ordinary medical articles are not eligible for Google Indexing API. '
              'Validation does not guarantee crawling, indexing or ranking. '
              'No HTML, sitemap dates or publication state were changed.\n'
          )
          print(message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(message)
          PY
